variables:
  - template: version.yaml
  - name: VersionCompiled
    value: '0.0.0'
  - name: BuildParameters.RestoreBuildProjects
    value: swagger/RedShirt.Adventure.Realm.Interop/*.csproj
  - name: BuildParameters.searchPatternPack
    value: swagger/RedShirt.Adventure.Realm.Interop/*.csproj
name: $(date:yyyyMMdd)$(rev:.r)
jobs:
  - job: Job_1
    displayName: RedShirt.Adventure.Realm.Interop
    pool:
      name: $(pool)
    steps:
      - checkout: self
      - task: DotNetCoreCLI@2
        displayName: Restore
        inputs:
          command: restore
          projects: $(BuildParameters.RestoreBuildProjects)
      - task: DotNetCoreCLI@2
        displayName: Build
        inputs:
          projects: $(BuildParameters.RestoreBuildProjects)
          arguments: --configuration $(BuildConfiguration)
      - task: DotNetCoreCLI@2
        displayName: dotnet pack
        inputs:
          command: pack
          searchPatternPack: $(BuildParameters.searchPatternPack)
          versioningScheme: byEnvVar
          versionEnvVar: VersionCompiled
          requestedMajorVersion: 0
          requestedPatchVersion: 1
...
